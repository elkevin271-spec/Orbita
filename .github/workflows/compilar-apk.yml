name: Compilar Orbita Spatial APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Organizar archivos Android subidos en raiz
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/hn/orbita app/src/main/res/drawable tests
          mv MainActivity.java OrbitService.java SpatialEngine.java SpatialStageView.java DemoKnocks.java app/src/main/java/hn/orbita/
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv orbita_icon.xml app/src/main/res/drawable/orbita_icon.xml
          mv AudioEngineTest.java RenderDemo.java test-engine.sh tests/
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'hn.orbita'
              compileSdk 35
              defaultConfig {
                  applicationId 'hn.orbita.spatial'
                  minSdk 29
                  targetSdk 35
                  versionCode 10
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes { release { minifyEnabled false } }
          }
          GRADLE

      - name: Probar motor binaural
        run: bash tests/test-engine.sh

      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Orbita-Spatial-1.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
